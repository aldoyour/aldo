// workergithub.js
const { Octokit } = require('@octokit/rest');
const fs = require('fs');
const path = require('path');
const axios = require('axios');
const config = require('./config');

const octokit = new Octokit({ auth: config.github_token });

async function uploadZipToRelease(zipPath, tagName) {
  const release = await octokit.repos.createRelease({
    owner: config.github_owner, repo: config.github_repo,
    tag_name: tagName, name: `Build ${tagName}`, draft: false, prerelease: true,
  });
  const fileName = path.basename(zipPath);
  const fileData = fs.readFileSync(zipPath);
  const uploadUrl = release.data.upload_url.replace('{?name,label}', '');
  const res = await axios.post(`${uploadUrl}?name=${encodeURIComponent(fileName)}`, fileData, {
    headers: {
      Authorization: `token ${config.github_token}`,
      'Content-Type': 'application/zip',
      'Content-Length': fileData.length,
    },
    maxBodyLength: Infinity, maxContentLength: Infinity,
  });
  return { releaseId: release.data.id, assetId: res.data.id, assetUrl: res.data.browser_download_url, tagName };
}

async function triggerWorkflow({ projectName, mode, builder, assetUrl, chatId, workflowFile }) {
  const wf = workflowFile || config.github_workflow;
  await octokit.actions.createWorkflowDispatch({
    owner: config.github_owner, repo: config.github_repo,
    workflow_id: wf, ref: 'main',
    inputs: {
      project_name: String(projectName),
      mode: String(mode),
      builder: String(builder),
      asset_url: String(assetUrl),
      chat_id: String(chatId),
    },
  });
  return true;
}

async function getLatestRun({ after, workflowFile }) {
  const wf = workflowFile || config.github_workflow;
  const { data } = await octokit.actions.listWorkflowRuns({
    owner: config.github_owner, repo: config.github_repo,
    workflow_id: wf, per_page: 10,
  });
  const runs = data.workflow_runs
    .filter((r) => new Date(r.created_at).getTime() >= after - 5000)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return runs[0] || null;
}

async function getRunStatus(runId) {
  const { data } = await octokit.actions.getWorkflowRun({
    owner: config.github_owner, repo: config.github_repo, run_id: runId,
  });
  return data;
}

async function getRunJobs(runId) {
  const { data } = await octokit.actions.listJobsForWorkflowRun({
    owner: config.github_owner, repo: config.github_repo, run_id: runId,
  });
  return data.jobs || [];
}

async function downloadArtifact(runId) {
  const { data: arts } = await octokit.actions.listWorkflowRunArtifacts({
    owner: config.github_owner, repo: config.github_repo, run_id: runId,
  });
  if (!arts.artifacts.length) throw new Error('Artifact gak ditemukan');
  const art = arts.artifacts[0];
  const res = await octokit.actions.downloadArtifact({
    owner: config.github_owner, repo: config.github_repo,
    artifact_id: art.id, archive_format: 'zip',
  });
  const outDir = path.join(__dirname, 'data');
  if (!fs.existsSync(outDir)) fs.mkdirSync(outDir, { recursive: true });
  const outPath = path.join(outDir, `artifact_${runId}.zip`);
  fs.writeFileSync(outPath, Buffer.from(res.data));
  return outPath;
}

async function listWorkflows() {
  try {
    const { data } = await octokit.actions.listRepoWorkflows({
      owner: config.github_owner, repo: config.github_repo,
    });
    return data.workflows.map((w) => ({ id: w.id, name: w.name, path: w.path }));
  } catch (e) { return [{ error: e.message }]; }
}

module.exports = {
  octokit, uploadZipToRelease, triggerWorkflow,
  getLatestRun, getRunStatus, getRunJobs, downloadArtifact, listWorkflows,
};
