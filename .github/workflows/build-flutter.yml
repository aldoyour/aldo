name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nama project"
        required: true
        type: string
      mode:
        description: "Build mode"
        required: true
        default: "release"
        type: string
      builder:
        description: "Nama builder"
        required: true
        type: string
      asset_url:
        description: "URL ZIP project"
        required: true
        type: string
      chat_id:
        description: "Telegram Chat ID"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Project ZIP
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$ASSET_URL" \
            -o project.zip

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          find project -name pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          cd project
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          cd project
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.project_name }}
          path: project/**/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
